<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Onboarding dry-run demo data</title><desc id="desc">An anonymous demo data example of a dry-run field comparison, explicitly not a real employee record.</desc>
  <rect width="1600" height="1000" fill="#f3efe7"/><g font-family="Arial,sans-serif"><rect x="0" y="0" width="1600" height="112" fill="#e84a2a"/><text x="92" y="72" fill="#fff" font-size="30" font-weight="800" letter-spacing="5">DEMO DATA · ANONYMOUS EXAMPLE</text><text x="92" y="205" fill="#11182a" font-size="71" font-weight="800">DRY-RUN OUTPUT, NOT AN INTERNAL UI.</text><text x="92" y="250" fill="#667085" font-size="24">Illustrative structure only · no real employee, field value, system URL or identifier</text>
  <rect x="92" y="340" width="1416" height="470" fill="#fff" stroke="#11182a" stroke-width="2"/><g font-size="20" font-weight="700" fill="#667085"><text x="132" y="398">FIELD</text><text x="570" y="398">SOURCE</text><text x="930" y="398">CURRENT</text><text x="1320" y="398">RESULT</text></g><line x1="132" y1="425" x2="1468" y2="425" stroke="#11182a" stroke-width="2"/>
  <g font-size="27" fill="#11182a"><text x="132" y="493">Example field A</text><text x="570" y="493">Sample value</text><text x="930" y="493">Sample value</text><text x="1320" y="493" fill="#173ca6" font-weight="800">MATCH</text><text x="132" y="585">Example field B</text><text x="570" y="585">Route 02</text><text x="930" y="585">Route 01</text><text x="1320" y="585" fill="#e84a2a" font-weight="800">REVIEW</text><text x="132" y="677">Write action</text><text x="570" y="677">Disabled</text><text x="930" y="677">Read-only</text><text x="1320" y="677" fill="#173ca6" font-weight="800">SAFE</text></g><g stroke="#d3d7df"><line x1="132" y1="520" x2="1468" y2="520"/><line x1="132" y1="612" x2="1468" y2="612"/><line x1="132" y1="704" x2="1468" y2="704"/></g>
  <text x="92" y="910" fill="#667085" font-size="20">The confirmed 11 / 11 statement refers to one specific Dry-run sample and is not a production accuracy metric.</text></g></svg>
