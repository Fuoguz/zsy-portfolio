<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Eagle training operations map</title><desc id="desc">A reconstructed operations chain across information, communication, delivery, survey, data and wrap-up.</desc>
