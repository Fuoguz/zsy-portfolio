<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">EagleHub change loop</title><desc id="desc">A reconstructed process loop for relationship, permission and exception changes.</desc>
  <rect width="1600" height="1000" fill="#f3efe7"/><g font-family="Arial,sans-serif"><text x="92" y="90" fill="#e84a2a" font-size="23" font-weight="700" letter-spacing="4">RECONSTRUCTED ITERATION LOOP</text><text x="92" y="185" fill="#11182a" font-size="74" font-weight="800">CHANGE IS PART OF THE PRODUCT.</text><text x="92" y="230" fill="#667085" font-size="24">Confirmed issue categories, redrawn without internal records.</text>
  <g transform="translate(80 360)"><rect x="0" y="0" width="300" height="250" fill="#173ca6"/><rect x="380" y="0" width="300" height="250" fill="#fff" stroke="#11182a" stroke-width="2"/><rect x="760" y="0" width="300" height="250" fill="#fff" stroke="#11182a" stroke-width="2"/><rect x="1140" y="0" width="300" height="250" fill="#e84a2a"/>
  <g font-weight="800" font-size="19"><text x="34" y="52" fill="#fff">01 / CHANGE</text><text x="414" y="52" fill="#173ca6">02 / TRACE</text><text x="794" y="52" fill="#173ca6">03 / CHECK</text><text x="1174" y="52" fill="#fff">04 / ITERATE</text></g><g font-size="37" font-weight="800"><text x="34" y="124" fill="#fff">RELATION</text><text x="414" y="124" fill="#11182a">PERMISSION</text><text x="794" y="124" fill="#11182a">EXCEPTION</text><text x="1174" y="124" fill="#fff">FEEDBACK</text></g><g font-size="19"><text x="34" y="171" fill="#dce5ff">mentor / learner state</text><text x="414" y="171" fill="#667085">department scope</text><text x="794" y="171" fill="#667085">abnormal data</text><text x="1174" y="171" fill="#ffe1d8">function update</text></g>
  <path d="M300 125H380M680 125H760M1060 125H1140" stroke="#11182a" stroke-width="4"/><path d="M357 111l23 14-23 14M737 111l23 14-23 14M1117 111l23 14-23 14" fill="none" stroke="#11182a" stroke-width="4"/></g>
  <text x="92" y="760" fill="#11182a" font-size="33" font-weight="800">Contribution evidence</text><text x="92" y="816" fill="#667085" font-size="24">Continued involvement covered department filtering, permission sync, mentor changes,</text><text x="92" y="852" fill="#667085" font-size="24">relationship state and exception handling — not the entire final production system.</text></g></svg>
