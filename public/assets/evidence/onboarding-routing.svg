<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Onboarding routing workflow</title><desc id="desc">A reconstructed workflow from roster parsing through rule routing, field differences and review.</desc>
  <rect width="1600" height="1000" fill="#11182a"/><g font-family="Arial,sans-serif"><text x="92" y="90" fill="#8fadff" font-size="23" font-weight="700" letter-spacing="4">RECONSTRUCTED RULE FLOW</text><text x="92" y="185" fill="#fff" font-size="76" font-weight="800">RULES BECOME REVIEWABLE.</text><text x="92" y="230" fill="#aeb8d7" font-size="24">No employee data · no internal paths · no credentials</text>
  <g transform="translate(92 355)"><rect width="250" height="200" fill="#f3efe7"/><rect x="290" width="250" height="200" fill="#f3efe7"/><rect x="580" width="250" height="200" fill="#173ca6"/><rect x="870" width="250" height="200" fill="#f3efe7"/><rect x="1160" width="250" height="200" fill="#e84a2a"/>
  <g font-size="18" font-weight="700"><text x="28" y="46" fill="#173ca6">01</text><text x="318" y="46" fill="#173ca6">02</text><text x="608" y="46" fill="#fff">03</text><text x="898" y="46" fill="#173ca6">04</text><text x="1188" y="46" fill="#fff">05</text></g><g font-size="30" font-weight="800"><text x="28" y="102" fill="#11182a">PARSE</text><text x="318" y="102" fill="#11182a">CLASSIFY</text><text x="608" y="102" fill="#fff">ROUTE</text><text x="898" y="102" fill="#11182a">DIFF</text><text x="1188" y="102" fill="#fff">REVIEW</text></g><g font-size="17"><text x="28" y="144" fill="#667085">source rows</text><text x="318" y="144" fill="#667085">type / grade</text><text x="608" y="144" fill="#dce5ff">rule branch</text><text x="898" y="144" fill="#667085">field by field</text><text x="1188" y="144" fill="#ffe1d8">export decision</text></g>
  <g stroke="#8fadff" stroke-width="4"><line x1="250" y1="100" x2="290" y2="100"/><line x1="540" y1="100" x2="580" y2="100"/><line x1="830" y1="100" x2="870" y2="100"/><line x1="1120" y1="100" x2="1160" y2="100"/></g></g>
  <rect x="92" y="665" width="1410" height="175" fill="#202b45"/><text x="126" y="720" fill="#e84a2a" font-size="20" font-weight="700">GUARDRAIL</text><text x="126" y="780" fill="#fff" font-size="38" font-weight="800">DRY-RUN FIRST → HUMAN REVIEW → WRITE-BACK DEFERRED</text><text x="92" y="930" fill="#aeb8d7" font-size="20">Validated scope: read, route, compare and review. Production automation is not claimed.</text></g></svg>
