<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Onboarding automation before and after</title><desc id="desc">A reconstructed comparison between manual checking and a read-only dry-run workflow.</desc>
  <rect width="1600" height="1000" fill="#f3efe7"/><g font-family="Arial,sans-serif"><text x="92" y="90" fill="#173ca6" font-size="23" font-weight="700" letter-spacing="4">RECONSTRUCTED BEFORE / AFTER</text><text x="92" y="185" fill="#11182a" font-size="74" font-weight="800">AUTOMATE THE CHECK.</text><text x="92" y="230" fill="#667085" font-size="24">Keep the human review · read-only Dry-run · no production write-back claim</text>
  <rect x="92" y="338" width="642" height="456" fill="#fff" stroke="#11182a" stroke-width="2"/><text x="132" y="398" fill="#e84a2a" font-size="22" font-weight="700">BEFORE / MANUAL</text><text x="132" y="472" fill="#11182a" font-size="41" font-weight="800">Roster</text><text x="132" y="548" fill="#11182a" font-size="41" font-weight="800">↓ Route by rule</text><text x="132" y="624" fill="#11182a" font-size="41" font-weight="800">↓ Open records</text><text x="132" y="700" fill="#11182a" font-size="41" font-weight="800">↓ Compare fields</text><text x="132" y="751" fill="#667085" font-size="20">Repeated navigation and manual checking</text>
  <rect x="866" y="338" width="642" height="456" fill="#173ca6"/><text x="906" y="398" fill="#fff" font-size="22" font-weight="700">AFTER / VALIDATED PROTOTYPE</text><text x="906" y="472" fill="#fff" font-size="41" font-weight="800">Parse source</text><text x="906" y="548" fill="#fff" font-size="41" font-weight="800">↓ Apply route rules</text><text x="906" y="624" fill="#fff" font-size="41" font-weight="800">↓ Read &amp; Diff</text><text x="906" y="700" fill="#fff" font-size="41" font-weight="800">↓ Human review / export</text><text x="906" y="751" fill="#dce5ff" font-size="20">Read-only first · visible output · controlled next step</text>
  <path d="M762 566H838" stroke="#e84a2a" stroke-width="7"/><path d="M816 548l22 18-22 18" fill="none" stroke="#e84a2a" stroke-width="7"/><text x="92" y="910" fill="#667085" font-size="20">Evidence type: public-safe reconstruction based on confirmed workflow steps.</text></g></svg>
