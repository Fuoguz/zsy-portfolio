<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Team formation flow</title><desc id="desc">A reconstructed user flow from viewing profiles through team validation.</desc>
  <rect width="1600" height="1000" fill="#11182a"/><g font-family="Arial,sans-serif"><text x="92" y="90" fill="#8fadff" font-size="23" font-weight="700" letter-spacing="4">RECONSTRUCTED DELIVERY FLOW</text><text x="92" y="185" fill="#fff" font-size="75" font-weight="800">A SMALL TOOL FOR A LARGE COORDINATION TASK.</text><text x="92" y="230" fill="#aeb8d7" font-size="24">Public-safe abstraction of confirmed functions</text>
  <g transform="translate(92 370)"><g fill="#f3efe7"><circle cx="135" cy="135" r="135"/><circle cx="515" cy="135" r="135"/><circle cx="895" cy="135" r="135"/><circle cx="1275" cy="135" r="135"/></g><g fill="#11182a" text-anchor="middle" font-weight="800"><text x="135" y="118" font-size="20">01</text><text x="135" y="160" font-size="28">VIEW INFO</text><text x="515" y="118" font-size="20">02</text><text x="515" y="160" font-size="28">CREATE TEAM</text><text x="895" y="118" font-size="20">03</text><text x="895" y="160" font-size="28">JOIN TEAM</text><text x="1275" y="118" font-size="20">04</text><text x="1275" y="160" font-size="28">VALIDATE</text></g><g stroke="#e84a2a" stroke-width="6"><line x1="270" y1="135" x2="380" y2="135"/><line x1="650" y1="135" x2="760" y2="135"/><line x1="1030" y1="135" x2="1140" y2="135"/></g><g fill="#e84a2a"><path d="M380 135l-24-15v30z"/><path d="M760 135l-24-15v30z"/><path d="M1140 135l-24-15v30z"/></g></g>
  <rect x="92" y="740" width="1410" height="120" fill="#202b45"/><text x="126" y="790" fill="#8fadff" font-size="18" font-weight="700">VALIDATION LAYER</text><text x="126" y="832" fill="#fff" font-size="27" font-weight="800">CLASS BOUNDARY · TEAM CAPACITY · MOBILE STATE · DATA MATCHING</text><text x="92" y="940" fill="#aeb8d7" font-size="20">The diagram explains the verified workflow; it is not a screenshot of the internal tool.</text></g></svg>
