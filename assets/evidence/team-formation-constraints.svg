<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Team formation constraints</title><desc id="desc">A reconstructed constraint map for a large team formation tool.</desc>
  <rect width="1600" height="1000" fill="#f3efe7"/><g font-family="Arial,sans-serif"><text x="92" y="90" fill="#173ca6" font-size="23" font-weight="700" letter-spacing="4">RECONSTRUCTED CONSTRAINT MAP</text><text x="92" y="185" fill="#11182a" font-size="76" font-weight="800">FREEDOM NEEDS RULES.</text><text x="92" y="230" fill="#667085" font-size="24">Confirmed business constraints · no participant names or class roster</text>
  <g transform="translate(92 355)"><rect width="330" height="360" fill="#173ca6"/><rect x="362" width="330" height="360" fill="#fff" stroke="#11182a" stroke-width="2"/><rect x="724" width="330" height="360" fill="#fff" stroke="#11182a" stroke-width="2"/><rect x="1086" width="330" height="360" fill="#e84a2a"/><g font-weight="800"><text x="34" y="65" fill="#fff" font-size="20">SCALE</text><text x="396" y="65" fill="#173ca6" font-size="20">STRUCTURE</text><text x="758" y="65" fill="#173ca6" font-size="20">RULE</text><text x="1120" y="65" fill="#fff" font-size="20">CHANNEL</text><text x="34" y="175" fill="#fff" font-size="61">400–500</text><text x="396" y="175" fill="#11182a" font-size="61">5</text><text x="758" y="175" fill="#11182a" font-size="61">10–12</text><text x="1120" y="175" fill="#fff" font-size="54">MOBILE</text></g><g font-size="22"><text x="34" y="220" fill="#dce5ff">participants</text><text x="396" y="220" fill="#667085">classes</text><text x="758" y="220" fill="#667085">people / team</text><text x="1120" y="220" fill="#ffe1d8">primary use</text></g><g font-size="19"><text x="34" y="305" fill="#dce5ff">business context</text><text x="396" y="305" fill="#667085">about 90 / class</text><text x="758" y="305" fill="#667085">capacity check</text><text x="1120" y="305" fill="#ffe1d8">touch-first flow</text></g></g><text x="92" y="900" fill="#667085" font-size="20">Scale describes the training scenario, not a claim of independent ownership.</text></g></svg>
