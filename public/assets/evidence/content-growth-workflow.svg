<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">AI content growth workflow</title><desc id="desc">A reconstructed workflow showing AI assistance and human judgment across content production.</desc>
