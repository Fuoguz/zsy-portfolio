<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">EagleHub role and permission model</title><desc id="desc">A reconstructed role map showing different needs and a shared permission boundary.</desc>
  <rect width="1600" height="1000" fill="#11182a"/><g font-family="Arial,sans-serif"><text x="92" y="90" fill="#8fadff" font-size="23" font-weight="700" letter-spacing="4">RECONSTRUCTED ROLE MODEL</text><text x="92" y="190" fill="#fff" font-size="76" font-weight="800">ONE SYSTEM, DIFFERENT VIEWS.</text><text x="92" y="235" fill="#aeb8d7" font-size="25">Roles share a workflow but should not share every permission or data scope.</text>
  <line x1="92" y1="292" x2="1508" y2="292" stroke="#44506f" stroke-width="2"/><circle cx="800" cy="600" r="190" fill="#173ca6"/><text x="800" y="575" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">SHARED CORE</text><text x="800" y="626" fill="#fff" font-size="22" text-anchor="middle">Plan · Task · Feedback</text><text x="800" y="663" fill="#fff" font-size="22" text-anchor="middle">Progress · Relationship</text>
  <g fill="#f3efe7"><circle cx="300" cy="470" r="140"/><circle cx="1300" cy="470" r="140"/><circle cx="800" cy="865" r="92"/></g><g fill="#11182a" font-weight="800" text-anchor="middle"><text x="300" y="455" font-size="31">LEARNER</text><text x="300" y="493" font-size="18">own plan view</text><text x="1300" y="455" font-size="31">MENTOR</text><text x="1300" y="493" font-size="18">guidance view</text><text x="800" y="855" font-size="24">HRBP</text><text x="800" y="887" font-size="16">scope + exceptions</text></g>
  <g fill="none" stroke="#e84a2a" stroke-width="5"><path d="M430 505L620 558"/><path d="M1170 505L980 558"/><path d="M800 773V790"/></g><text x="92" y="948" fill="#aeb8d7" font-size="20">Public-safe abstraction · no department names, identities or internal fields.</text></g></svg>
